<!-- создать страницу, кнопку на ней - кнопка должна менять цвет при наведении и менять текст при нажатии на нее-->
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <!-- подключаем скрипты, всю логику событий прописываем в script.js-->
    <!-- <script src="script.js"></script> -->
  </head>
  <body>
    <button id="changeTextButton">Кнопка розовая</button>
    <script>
      document
        .getElementById("changeTextButton")
        .addEventListener("click", function () {
          if (this.textContent === "Кнопка розовая") {
            this.textContent = "Кнопка нажата";
          } else {
            this.textContent = "Кнопка розовая";
          }
        });
    </script>
  </body>
</html>
