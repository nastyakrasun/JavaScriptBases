<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример JavaScript</title>
</head>
<body>
    <h1 id="text">Нажмите на кнопку для изменения текста</h1>
    <button id="changeTextButton">Изменить текст</button>

    <script>
        // Изменение текста при клике на кнопку
        const button = document.getElementById('changeTextButton');
        const textElement = document.getElementById('text');

        button.addEventListener('click', () => {
            textElement.textContent = 'Текст изменен!';
        });

        // Асинхронный запрос к API и вывод результата на страницу
        async function fetchData() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd');
                
                if (!response.ok) {
                    throw new Error(`Ошибка: ${response.status}`);
                }

                const data = await response.json();
                const firstCoin = data[0]; // Получаем первую монету из массива
                
                const postElement = document.createElement('div');
                postElement.innerHTML = `<h2>${firstCoin.name}</h2><p>Цена: $${firstCoin.current_price}</p>`;
                document.body.appendChild(postElement);
                
            } catch (error) {
                console.error("Ошибка при получении данных:", error);
            }
        }

        fetchData();
    </script>
</body>
</html>
